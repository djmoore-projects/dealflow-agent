name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: git SHA)"
        required: false

permissions:
  id-token: write   # required for OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: dealflow-agent-prod     # matches local.name_prefix in Terraform

jobs:
  build-and-deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest

      - name: Fetch current task definition
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECR_REPO }} \
            --query taskDefinition \
            --output json > task-def.json

      - name: Update image in task definition
        id: new-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: app
          image: ${{ steps.tag.outputs.image }}

      - name: Deploy updated task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.new-task-def.outputs.task-definition }}
          service: ${{ env.ECR_REPO }}
          cluster: ${{ env.ECR_REPO }}
          wait-for-service-stability: true
          wait-for-minutes: 10

      - name: Verify health endpoint
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ${{ env.ECR_REPO }} \
            --query "LoadBalancers[0].DNSName" \
            --output text)
          for i in {1..10}; do
            STATUS=$(curl -sk "https://${ALB_DNS}/health" | jq -r '.status' 2>/dev/null)
            if [ "$STATUS" = "ok" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for health check... (attempt $i)"
            sleep 10
          done
          echo "Health check failed after 10 attempts." >&2
          exit 1
