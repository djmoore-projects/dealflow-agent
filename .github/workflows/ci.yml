name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + RAGAS evals
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dealflow
          POSTGRES_PASSWORD: dealflow
          POSTGRES_DB: dealflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dealflow -d dealflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DATABASE_URL: postgresql+psycopg://dealflow:dealflow@localhost:5432/dealflow
      CLAUDE_MODEL: claude-sonnet-4-20250514
      LOG_FORMAT: console
      FAITHFULNESS_THRESHOLD: "0.75"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: Run RAGAS eval suite (golden mode — no live retrieval required)
        # Uses pre-written golden contexts, not pgvector. Fails if faithfulness < 0.75.
        run: python -m src.evals.ragas_suite

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
