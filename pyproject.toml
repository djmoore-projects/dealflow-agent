[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealflow-agent"
version = "0.1.0"
description = "Multi-agent investment deal analysis system"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.28",
    "langchain>=0.3.14",
    "langchain-community>=0.3.14",
    "langchain-openai>=0.2.14",
    "langchain-postgres>=0.0.12",
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "mcp>=1.3.0",
    "ragas>=0.2.11",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.2.4",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "pypdf>=5.1.0",
    "tavily-python>=0.5.0",
    "datasets>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "respx>=0.21.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "ANTHROPIC_API_KEY=test-key",
    "OPENAI_API_KEY=test-key",
    "DATABASE_URL=postgresql+psycopg://dealflow:dealflow@localhost:5432/dealflow",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
